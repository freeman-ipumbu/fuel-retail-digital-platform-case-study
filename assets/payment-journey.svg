<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Payment journey</title>
  <desc id="desc">A seven-step journey showing basket creation, classification, QR request, customer review, policy evaluation, authorization and recorded outcome.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07151F"/>
      <stop offset="1" stop-color="#123442"/>
    </linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFC44D"/>
      <stop offset="1" stop-color="#FF8A36"/>
    </linearGradient>
    <linearGradient id="cool" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4FE0C1"/>
      <stop offset="1" stop-color="#42A5FF"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0L9 4.5L0 9Z" fill="#769AA3"/>
    </marker>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="15" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="30" fill="url(#bg)"/>
  <g font-family="Inter, Arial, sans-serif">
    <text x="70" y="74" font-size="15" font-weight="800" letter-spacing="2" fill="#4FE0C1">PAYMENT JOURNEY</text>
    <text x="70" y="123" font-size="40" font-weight="850" letter-spacing="-1" fill="#F5FAFB">A quick checkout with nowhere for ambiguity to hide.</text>
    <text x="70" y="158" font-size="16" fill="#92B2B9">Every handoff has an owner, a rule and a final state.</text>

    <path d="M150 350H1450" stroke="#496B75" stroke-width="3" stroke-dasharray="8 11"/>

    <g transform="translate(70 238)" filter="url(#shadow)">
      <rect width="190" height="225" rx="22" fill="#F5FAF9"/>
      <circle cx="32" cy="33" r="17" fill="#163643"/>
      <text x="32" y="39" text-anchor="middle" font-size="15" font-weight="850" fill="#FFFFFF">1</text>
      <text x="22" y="86" font-size="17" font-weight="850" fill="#15323E">Create basket</text>
      <text x="22" y="118" font-size="13" fill="#607982">Station, till, lines,</text>
      <text x="22" y="140" font-size="13" fill="#607982">amount and expiry</text>
      <rect x="22" y="166" width="146" height="34" rx="10" fill="#E5EEEF"/>
      <text x="95" y="188" text-anchor="middle" font-size="11" font-weight="850" letter-spacing="1" fill="#516A72">STATION</text>
    </g>

    <path d="M260 350H290" stroke="#769AA3" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(300 238)" filter="url(#shadow)">
      <rect width="190" height="225" rx="22" fill="#F5FAF9"/>
      <circle cx="32" cy="33" r="17" fill="#163643"/>
      <text x="32" y="39" text-anchor="middle" font-size="15" font-weight="850" fill="#FFFFFF">2</text>
      <text x="22" y="86" font-size="17" font-weight="850" fill="#15323E">Classify lines</text>
      <text x="22" y="118" font-size="13" fill="#607982">Fuel, eligible,</text>
      <text x="22" y="140" font-size="13" fill="#607982">restricted or unknown</text>
      <rect x="22" y="166" width="146" height="34" rx="10" fill="#FFF0D9"/>
      <text x="95" y="188" text-anchor="middle" font-size="11" font-weight="850" letter-spacing="1" fill="#A3601F">FAIL CLOSED</text>
    </g>

    <path d="M490 350H520" stroke="#769AA3" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(530 238)" filter="url(#shadow)">
      <rect width="190" height="225" rx="22" fill="#F5FAF9"/>
      <circle cx="32" cy="33" r="17" fill="#163643"/>
      <text x="32" y="39" text-anchor="middle" font-size="15" font-weight="850" fill="#FFFFFF">3</text>
      <text x="22" y="86" font-size="17" font-weight="850" fill="#15323E">Issue request</text>
      <text x="22" y="118" font-size="13" fill="#607982">Short-lived QR with</text>
      <text x="22" y="140" font-size="13" fill="#607982">single-use protection</text>
      <rect x="22" y="166" width="146" height="34" rx="10" fill="#E6F6F2"/>
      <text x="95" y="188" text-anchor="middle" font-size="11" font-weight="850" letter-spacing="1" fill="#238C75">EXPIRING</text>
    </g>

    <path d="M720 350H750" stroke="#769AA3" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(760 238)" filter="url(#shadow)">
      <rect width="190" height="225" rx="22" fill="#F5FAF9"/>
      <circle cx="32" cy="33" r="17" fill="#163643"/>
      <text x="32" y="39" text-anchor="middle" font-size="15" font-weight="850" fill="#FFFFFF">4</text>
      <text x="22" y="86" font-size="17" font-weight="850" fill="#15323E">Customer review</text>
      <text x="22" y="118" font-size="13" fill="#607982">Site, basket split,</text>
      <text x="22" y="140" font-size="13" fill="#607982">amount and funding</text>
      <rect x="22" y="166" width="146" height="34" rx="10" fill="#E6F6F2"/>
      <text x="95" y="188" text-anchor="middle" font-size="11" font-weight="850" letter-spacing="1" fill="#238C75">CONFIRM</text>
    </g>

    <path d="M950 350H980" stroke="#769AA3" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(990 238)" filter="url(#shadow)">
      <rect width="190" height="225" rx="22" fill="#F5FAF9"/>
      <circle cx="32" cy="33" r="17" fill="#163643"/>
      <text x="32" y="39" text-anchor="middle" font-size="15" font-weight="850" fill="#FFFFFF">5</text>
      <text x="22" y="86" font-size="17" font-weight="850" fill="#15323E">Evaluate rules</text>
      <text x="22" y="118" font-size="13" fill="#607982">Promotional and fleet</text>
      <text x="22" y="140" font-size="13" fill="#607982">decisions before spend</text>
      <rect x="22" y="166" width="146" height="34" rx="10" fill="#FFF0D9"/>
      <text x="95" y="188" text-anchor="middle" font-size="11" font-weight="850" letter-spacing="1" fill="#A3601F">VERSIONED</text>
    </g>

    <path d="M1180 350H1210" stroke="#769AA3" stroke-width="2" marker-end="url(#arrow)"/>
    <g transform="translate(1220 238)" filter="url(#shadow)">
      <rect width="190" height="225" rx="22" fill="#F5FAF9"/>
      <circle cx="32" cy="33" r="17" fill="#163643"/>
      <text x="32" y="39" text-anchor="middle" font-size="15" font-weight="850" fill="#FFFFFF">6</text>
      <text x="22" y="86" font-size="17" font-weight="850" fill="#15323E">Authorize</text>
      <text x="22" y="118" font-size="13" fill="#607982">Approved provider</text>
      <text x="22" y="140" font-size="13" fill="#607982">returns final outcome</text>
      <rect x="22" y="166" width="146" height="34" rx="10" fill="#E5EEEF"/>
      <text x="95" y="188" text-anchor="middle" font-size="11" font-weight="850" letter-spacing="1" fill="#516A72">PROVIDER</text>
    </g>

    <path d="M1410 350H1440V520H800V555" fill="none" stroke="#769AA3" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(570 570)" filter="url(#shadow)">
      <rect width="460" height="164" rx="24" fill="#102A37" stroke="#4FE0C1" stroke-opacity="0.5" stroke-width="2"/>
      <circle cx="43" cy="42" r="20" fill="url(#cool)"/>
      <text x="43" y="48" text-anchor="middle" font-size="16" font-weight="900" fill="#08202A">7</text>
      <text x="79" y="48" font-size="20" font-weight="850" fill="#FFFFFF">Publish one final outcome</text>
      <text x="28" y="89" font-size="14" fill="#9DB9BF">Station status  •  Customer receipt  •  Ledger entry</text>
      <text x="28" y="116" font-size="14" fill="#9DB9BF">Reconciliation record  •  Operational evidence</text>
      <rect x="28" y="132" width="404" height="5" rx="2.5" fill="url(#warm)"/>
    </g>

    <g transform="translate(70 785)">
      <rect width="1460" height="70" rx="18" fill="#FFFFFF" fill-opacity="0.055" stroke="#FFFFFF" stroke-opacity="0.11"/>
      <text x="24" y="30" font-size="12" font-weight="850" letter-spacing="1.4" fill="#FFBE55">RETRY SAFELY</text>
      <text x="24" y="52" font-size="14" fill="#B4CDD2">The same idempotency key returns the same logical result. Expired and previously used requests are rejected.</text>
      <text x="1408" y="42" text-anchor="end" font-size="13" font-weight="800" fill="#4FE0C1">CLEAR STATE  •  CLEAR OWNER  •  CLEAR EVIDENCE</text>
    </g>
  </g>
</svg>
