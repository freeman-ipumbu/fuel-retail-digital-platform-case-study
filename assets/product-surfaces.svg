    <text x="80" y="143" font-size="42" font-weight="800" letter-spacing="-1.2" fill="#F7FBFC">Different pressures. One dependable transaction.</text>
    <text x="1518" y="99" text-anchor="end" font-size="15" font-weight="600" fill="#7698A1">ILLUSTRATIVE DATA</text>

    <g transform="translate(80 200)" filter="url(#shadow)">
      <rect width="330" height="590" rx="26" fill="#F5FAF9"/>
      <rect width="330" height="74" rx="26" fill="#102A37"/>
      <path d="M0 48H330V74H0Z" fill="#102A37"/>
      <circle cx="32" cy="36" r="10" fill="url(#teal)"/>
      <text x="52" y="42" font-size="16" font-weight="800" fill="#FFFFFF">CUSTOMER</text>
      <text x="300" y="42" text-anchor="end" font-size="12" font-weight="700" fill="#8FB1B8">PAY</text>

      <text x="26" y="119" font-size="13" font-weight="700" letter-spacing="1.3" fill="#738990">PAYMENT REQUEST</text>
      <text x="26" y="164" font-size="32" font-weight="850" fill="#102A37">N$ 842.50</text>
      <rect x="26" y="188" width="278" height="1" fill="#D9E5E5"/>

      <text x="26" y="226" font-size="15" font-weight="700" fill="#213D48">Basket</text>
      <text x="26" y="260" font-size="14" fill="#516A72">Fuel</text>
      <text x="304" y="260" text-anchor="end" font-size="14" font-weight="700" fill="#213D48">N$ 720.00</text>
      <text x="26" y="292" font-size="14" fill="#516A72">Shop items</text>
      <text x="304" y="292" text-anchor="end" font-size="14" font-weight="700" fill="#213D48">N$ 122.50</text>

      <rect x="26" y="322" width="278" height="94" rx="16" fill="#E8F7F3" stroke="#BCE8DC"/>
      <text x="44" y="350" font-size="12" font-weight="800" letter-spacing="1" fill="#21876F">ELIGIBLE VALUE</text>
      <text x="44" y="385" font-size="25" font-weight="850" fill="#123B35">N$ 122.50</text>
      <circle cx="275" cy="368" r="16" fill="#33BE9D"/>
      <path d="M268 368L273 373L282 362" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

      <text x="26" y="458" font-size="13" font-weight="700" fill="#738990">FUNDING</text>
      <rect x="26" y="474" width="278" height="58" rx="14" fill="#FFFFFF" stroke="#D4E2E2"/>
      <circle cx="51" cy="503" r="11" fill="#102A37"/>
      <text x="73" y="509" font-size="14" font-weight="700" fill="#213D48">Approved provider</text>
      <circle cx="281" cy="503" r="8" fill="#33BE9D"/>
      <rect x="26" y="548" width="278" height="52" rx="14" fill="url(#amber)"/>
      <text x="165" y="581" text-anchor="middle" font-size="15" font-weight="850" fill="#15232A">REVIEW AND APPROVE</text>
