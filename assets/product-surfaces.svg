      <rect width="330" height="74" rx="26" fill="#102A37"/>
      <path d="M0 48H330V74H0Z" fill="#102A37"/>
      <circle cx="32" cy="36" r="10" fill="#9B8CFF"/>
      <text x="52" y="42" font-size="16" font-weight="800" fill="#FFFFFF">OPERATIONS</text>
      <text x="300" y="42" text-anchor="end" font-size="12" font-weight="700" fill="#8FB1B8">LIVE</text>

      <text x="26" y="119" font-size="13" font-weight="700" letter-spacing="1.3" fill="#738990">NETWORK HEALTH</text>
      <rect x="26" y="140" width="278" height="78" rx="16" fill="#E8F7F3" stroke="#BCE8DC"/>
      <circle cx="58" cy="179" r="11" fill="#33BE9D"/>
      <text x="82" y="175" font-size="13" font-weight="800" fill="#21876F">ALL CORE SERVICES</text>
      <text x="82" y="196" font-size="15" font-weight="800" fill="#123B35">Operating normally</text>

      <text x="26" y="261" font-size="13" font-weight="800" letter-spacing="1" fill="#738990">RECONCILIATION</text>
      <rect x="26" y="280" width="278" height="92" rx="16" fill="#FFFFFF" stroke="#D4E2E2"/>
      <text x="44" y="311" font-size="14" fill="#516A72">Matched</text>
      <text x="286" y="312" text-anchor="end" font-size="20" font-weight="850" fill="#213D48">99.7%</text>
      <rect x="44" y="334" width="242" height="8" rx="4" fill="#DDE8E8"/>
      <rect x="44" y="334" width="232" height="8" rx="4" fill="url(#teal)"/>

      <text x="26" y="415" font-size="13" font-weight="800" letter-spacing="1" fill="#738990">OPEN EXCEPTIONS</text>
      <g transform="translate(26 434)">
        <rect width="278" height="64" rx="14" fill="#FFF2E4" stroke="#F5D3AA"/>
        <text x="18" y="27" font-size="13" font-weight="800" fill="#824A18">3 need ownership</text>
        <text x="18" y="46" font-size="12" fill="#A46D3B">Oldest: 18 minutes</text>
        <path d="M246 24L258 32L246 40" fill="none" stroke="#B86617" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g transform="translate(26 510)">
        <rect width="278" height="74" rx="14" fill="#102A37"/>
        <text x="18" y="29" font-size="12" font-weight="800" letter-spacing="1" fill="#8FB1B8">CONTROL CHECK</text>
        <text x="18" y="53" font-size="14" font-weight="800" fill="#FFFFFF">Zero fuel-linked value</text>
        <circle cx="252" cy="37" r="13" fill="#33BE9D"/>
        <path d="M246 37L250 41L257 33" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <path d="M410 817H1190" stroke="#31515C" stroke-width="2" stroke-dasharray="5 9"/>
    <circle cx="410" cy="817" r="5" fill="#4FE0C1"/>
    <circle cx="780" cy="817" r="5" fill="#FFC44D"/>
    <circle cx="1190" cy="817" r="5" fill="#9B8CFF"/>
    <text x="800" y="853" text-anchor="middle" font-size="15" font-weight="700" fill="#7F9EA6">SHARED IDENTITY  •  RULES  •  PAYMENT STATE  •  LEDGER  •  EVIDENCE</text>
