      <rect x="170" y="218" width="134" height="101" rx="16" fill="#FFF2E4" stroke="#F5D3AA"/>
      <text x="187" y="246" font-size="12" font-weight="800" letter-spacing="1" fill="#A35F1E">CONTROLLED</text>
      <text x="187" y="286" font-size="29" font-weight="850" fill="#C66F1B">4</text>

