      <rect width="330" height="74" rx="26" fill="#102A37"/>
      <path d="M0 48H330V74H0Z" fill="#102A37"/>
      <circle cx="32" cy="36" r="10" fill="url(#amber)"/>
      <text x="52" y="42" font-size="16" font-weight="800" fill="#FFFFFF">STATION</text>
      <text x="300" y="42" text-anchor="end" font-size="12" font-weight="700" fill="#8FB1B8">TILL 04</text>

      <text x="26" y="119" font-size="13" font-weight="700" letter-spacing="1.3" fill="#738990">REQUEST STATUS</text>
      <rect x="26" y="140" width="278" height="104" rx="17" fill="#E8F7F3" stroke="#BCE8DC"/>
      <circle cx="67" cy="192" r="25" fill="#33BE9D"/>
      <path d="M56 192L64 200L79 182" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="107" y="185" font-size="13" font-weight="800" letter-spacing="1" fill="#21876F">APPROVED</text>
      <text x="107" y="211" font-size="16" font-weight="800" fill="#123B35">Goods may be released</text>

      <text x="26" y="287" font-size="13" font-weight="700" fill="#738990">ORDER 2184</text>
      <text x="304" y="287" text-anchor="end" font-size="13" font-weight="700" fill="#738990">14:32:08</text>
      <rect x="26" y="305" width="278" height="1" fill="#D9E5E5"/>
      <text x="26" y="346" font-size="14" fill="#516A72">Basket lines</text>
      <text x="304" y="346" text-anchor="end" font-size="14" font-weight="700" fill="#213D48">3</text>
      <text x="26" y="380" font-size="14" fill="#516A72">Total</text>
      <text x="304" y="380" text-anchor="end" font-size="14" font-weight="700" fill="#213D48">N$ 842.50</text>
      <text x="26" y="414" font-size="14" fill="#516A72">Reference</text>
      <text x="304" y="414" text-anchor="end" font-size="14" font-weight="700" fill="#213D48">FR-2184</text>

      <rect x="26" y="454" width="278" height="59" rx="14" fill="#FFFFFF" stroke="#D4E2E2"/>
      <text x="44" y="480" font-size="12" font-weight="800" letter-spacing="1" fill="#738990">EVIDENCE</text>
      <text x="44" y="501" font-size="13" font-weight="700" fill="#213D48">Outcome and receipt recorded</text>
      <rect x="26" y="532" width="278" height="52" rx="14" fill="#102A37"/>
      <text x="165" y="565" text-anchor="middle" font-size="15" font-weight="850" fill="#FFFFFF">START NEXT ORDER</text>
