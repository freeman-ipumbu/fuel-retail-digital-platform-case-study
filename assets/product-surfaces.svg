<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Four coordinated product surfaces</title>
  <desc id="desc">Neutral interface illustrations for a customer app, station checkout, fleet controls and an operations console.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="0" x2="1520" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#06131C"/>
      <stop offset="1" stop-color="#113242"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFC44D"/>
      <stop offset="1" stop-color="#FF8A36"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#4FE0C1"/>
      <stop offset="1" stop-color="#42A5FF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="32" fill="url(#bg)"/>
