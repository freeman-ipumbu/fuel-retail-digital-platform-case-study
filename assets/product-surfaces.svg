        <rect width="278" height="62" rx="13" fill="#FFFFFF" stroke="#D4E2E2"/>
        <circle cx="25" cy="31" r="9" fill="#33BE9D"/>
        <text x="45" y="27" font-size="13" font-weight="800" fill="#213D48">Vehicle 014</text>
        <text x="45" y="45" font-size="12" fill="#738990">Within value and category rules</text>
        <text x="255" y="36" text-anchor="end" font-size="12" font-weight="800" fill="#21876F">PASS</text>
      </g>
      <g transform="translate(26 460)">
        <rect width="278" height="62" rx="13" fill="#FFFFFF" stroke="#D4E2E2"/>
        <circle cx="25" cy="31" r="9" fill="#F19A42"/>
        <text x="45" y="27" font-size="13" font-weight="800" fill="#213D48">Vehicle 021</text>
        <text x="45" y="45" font-size="12" fill="#738990">Daily limit reached</text>
        <text x="255" y="36" text-anchor="end" font-size="12" font-weight="800" fill="#B86617">DECLINE</text>
      </g>
      <rect x="26" y="540" width="278" height="44" rx="13" fill="#102A37"/>
      <text x="165" y="568" text-anchor="middle" font-size="14" font-weight="850" fill="#FFFFFF">OPEN POLICY CENTRE</text>
